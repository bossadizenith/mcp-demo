services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: incido
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - incido_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d incido"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  incido_pg:
